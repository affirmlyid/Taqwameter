<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taqwameter Live</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chart.js/dist/chart.min.css">
<style>
  body { font-family: Arial, sans-serif; background-color: #f0f4f8; color: #0a2540; margin:0; padding:0; }
  header { background-color:#0b1f3f; color:#fff; padding:1rem; text-align:center; }
  header input { padding:0.5rem; margin-top:0.5rem; border-radius:5px; border:none; width:200px; }
  header button { padding:0.5rem 1rem; margin-left:5px; border:none; border-radius:5px; cursor:pointer; background-color:#fff;color:#0b1f3f; }
  .calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; padding:1rem; }
  .day { padding:1rem; border-radius:5px; cursor:pointer; text-align:center; font-weight:bold; transition:0.2s; }
  .day.green{background-color:#4caf50;color:#fff;}
  .day.red{background-color:#f44336;color:#fff;}
  .day.today{border:2px solid #2196F3;}
  .day:hover{transform:scale(1.1); box-shadow:0 0 10px rgba(0,0,0,0.3);}
  .modal{display:none; position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5); justify-content:center; align-items:center;}
  .modal-content{background:#fff;padding:2rem;border-radius:10px;width:90%; max-width:600px; max-height:90%; overflow-y:auto;}
  button{padding:0.5rem 1rem; margin-top:1rem; cursor:pointer; background-color:#0b1f3f; color:#fff; border:none; border-radius:5px;}
  .section{padding:1rem;}
  .motivBanner{background:linear-gradient(90deg,#0b1f3f,#2196F3); color:#fff; padding:1rem; border-radius:10px; text-align:center; margin-bottom:1rem; font-weight:bold;}
</style>
</head>
<body>

<header>
  <h1>Taqwameter Live</h1>
  <p id="greeting"></p>
  <input type="text" id="username" placeholder="Masukkan nama kamu" />
  <button id="saveNameBtn">Simpan Nama</button>
</header>

<section class="section">
  <div class="motivBanner" id="motivBanner"></div>
  <h2>Ayat Al-Qur'an Harian</h2>
  <p id="dailyAyah">...</p>
</section>

<section class="section">
  <h2>Kalender Ibadah</h2>
  <div class="calendar" id="calendar"></div>
</section>

<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalDate">Tanggal</h3>
    <form id="dailyForm">
      <div id="questionsContainer"></div>
      <button type="submit">Simpan Skor</button>
    </form>
  </div>
</div>

<section class="section">
  <h2>Radar Chart & Rekap</h2>
  <canvas id="radarChart"></canvas>
</section>

<section class="section">
  <button id="generatePDF">Download PDF Raport</button>
</section>

<section class="section">
  <h2>Share Progress</h2>
  <button onclick="shareWA()">Share WA</button>
  <button onclick="shareEmail()">Share Email</button>
  <button onclick="shareIG()">Share IG</button>
  <button onclick="shareTT()">Share TikTok</button>
</section>

<section class="section">
  <button onclick="window.open('http://api.whatsapp.com/send/?phone=6285717115987')">Konsultasi Sekarang</button>
</section>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
// ====== User & Greeting ======
const usernameInput=document.getElementById('username');
const saveNameBtn=document.getElementById('saveNameBtn');
const greeting=document.getElementById('greeting');
function loadUsername(){
  const name=localStorage.getItem('taqwUser');
  if(name){usernameInput.value=name; greeting.innerText=`Assalamu'alaikum, ${name}! Semoga ibadahmu hari ini lancar.`;}
}
saveNameBtn.addEventListener('click',()=>{
  const name=usernameInput.value.trim();
  if(name){localStorage.setItem('taqwUser',name); loadUsername();}
  else alert('Nama harus diisi!');
});
loadUsername();

// ====== Ayat Harian ======
const ayatData=[
{text:"Dan dirikanlah shalat...",source:"QS. Al-Baqarah:43"},
{text:"Sesungguhnya shalat itu...",source:"QS. Al-Ma'idah:6"},
{text:"Allah tidak membebani seseorang...",source:"QS. Al-Baqarah:286"}];
const dailyAyah=document.getElementById('dailyAyah');
function showDailyAyah(){ const day=new Date().getDate(); const ayah=ayatData[day%ayatData.length]; dailyAyah.innerText=`${ayah.text} (${ayah.source})`; }
showDailyAyah();

// ====== Motivasi Banner ======
const motivBanner=document.getElementById('motivBanner');
const banners=["✨ Tetap semangat shalat hari ini!","📖 Bacalah Al-Qur’an untuk hati yang tenang.","💰 Sedekah sedikit tiap hari, pahala besar!"];
function showMotivBanner(){ const day=new Date().getDate(); motivBanner.innerText=banners[day%banners.length]; }
showMotivBanner();

// ====== Kalender ======
const calendar=document.getElementById('calendar');
const questions=['Ibadah wajib','Al-Qur’an','Sholat sunnah','Sikap','Self-control','Confident','Produktivitas','Sedekah','Kondisi mental','Kebaikan sosial'];
const questionIcons={'Ibadah wajib':'🕌','Al-Qur’an':'📖','Sholat sunnah':'🙏','Sikap':'🙂','Self-control':'🧘‍♂️','Confident':'💪','Produktivitas':'📈','Sedekah':'💰','Kondisi mental':'🧠','Kebaikan sosial':'🤝'};
function renderCalendar(){
  const daysInMonth=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
  const todayDate=new Date().getDate();
  calendar.innerHTML='';
  for(let d=1; d<=daysInMonth; d++){
    const dayDiv=document.createElement('div');
    dayDiv.className='day';
    const key=`day-${d}`;
    const filled=localStorage.getItem(key);
    dayDiv.classList.add(filled?'green':'red');
    if(d===todayDate) dayDiv.classList.add('today');
    dayDiv.innerText=d;
    dayDiv.title = filled ? "✅ Skor hari ini tersimpan" : "❌ Belum mengisi skor";
    dayDiv.addEventListener('click',()=>openModal(d));
    calendar.appendChild(dayDiv);
  }
}
renderCalendar();

// ====== Modal ======
const modal=document.getElementById('modal');
const modalDate=document.getElementById('modalDate');
const questionsContainer=document.getElementById('questionsContainer');
const dailyForm=document.getElementById('dailyForm');
function openModal(day){
  if(!localStorage.getItem('taqwUser')) return alert('Isi nama dulu!');
  modal.style.display='flex';
  modalDate.innerText=`Tanggal ${day}`;
  questionsContainer.innerHTML='';
  questions.forEach(q=>{ questionsContainer.innerHTML+=`<label>${questionIcons[q]} ${q} (1-5)</label><input type="number" min="1" max="5" name="${q}" required />`; });
  dailyForm.onsubmit=function(e){
    e.preventDefault();
    const data={};
    questions.forEach(q=>data[q]=parseInt(this[q].value));
    localStorage.setItem(`day-${day}`,JSON.stringify(data));
    modal.style.display='none';
    renderCalendar();
    updateRadarAndAnalysis(day);
  }
}

// ====== Radar Chart ======
const ctx=document.getElementById('radarChart').getContext('2d');
let radarChart=new Chart(ctx,{ type:'radar', data:{ labels:questions, datasets:[{label:'Skor Harian', data:Array(questions.length).fill(0), backgroundColor:'rgba(11,31,63,0.2)', borderColor:'rgba(11,31,63,1)', borderWidth:2, pointStyle:["🕌","📖","🙏","🙂","🧘‍♂️","💪","📈","💰","🧠","🤝"], pointRadius:10 }]}, options:{scales:{r:{beginAtZero:true,min:0,max:5}}} });
function updateRadar(){ const today=new Date().getDate(); const data=JSON.parse(localStorage.getItem(`day-${today}`))||{}; radarChart.data.datasets[0].data=questions.map(q=>data[q]||0); radarChart.update(); }

// ====== Analisis & Rekomendasi ======
function analyzeScore(day){
  const data=JSON.parse(localStorage.getItem(`day-${day}`))||{};
  let messages=[]; let recommendations=[];
  questions.forEach(q=>{ const score=data[q]||0; if(score<=2){ messages.push(`Indikator "${q}" bisa ditingkatkan.`); switch(q){ case 'Ibadah wajib': recommendations.push('Perbanyak fokus shalat tepat waktu dan khusyuk.'); break; case 'Al-Qur’an': recommendations.push('Baca minimal 1 halaman Al-Qur’an dan tadabbur.'); break; case 'Sholat sunnah': recommendations.push('Tambahkan sholat sunnah rawatib.'); break; case 'Sikap': recommendations.push('Latih sabar dan toleransi.'); break; case 'Self-control': recommendations.push('Hindari hal-hal yang memicu emosi negatif.'); break; case 'Confident': recommendations.push('Tingkatkan percaya diri melalui dzikir dan doa.'); break; case 'Produktivitas': recommendations.push('Buat daftar prioritas ibadah & kerjaan.'); break; case 'Sedekah': recommendations.push('Sisihkan sedikit rezeki setiap hari untuk sedekah.'); break; case 'Kondisi mental': recommendations.push('Dzikir untuk menenangkan hati.'); break; case 'Kebaikan sosial': recommendations.push('Lakukan 1 kebaikan sosial tiap hari.'); break;}}});
  return {messages:messages.length?messages:['Semua indikator bagus hari ini, tetap pertahankan!'], recommendations:[...new Set(recommendations)]};
}

// ====== Rekap ======
function getWeeklyMonthlySummary(){
  const today=new Date(); const currentDay=today.getDate();
  let weeklyScores=[]; let monthlyScores=[];
  for(let d=1; d<=currentDay; d++){ const data=JSON.parse(localStorage.getItem(`day-${d}`))||{}; const dayAvg=questions.reduce((sum,q)=>sum+(data[q]||0),0)/questions.length; monthlyScores.push(dayAvg); if(d>currentDay-7) weeklyScores.push(dayAvg); }
  const weeklyAvg=weeklyScores.length?(weeklyScores.reduce((a,b)=>a+b,0)/weeklyScores.length).toFixed(2):0;
  const monthlyAvg=monthlyScores.length?(monthlyScores.reduce((a,b)=>a+b,0)/monthlyScores.length).toFixed(2):0;
  return {weeklyAvg,monthlyAvg};
}

// ====== Update Radar + Analisis ======
const motivationalAyah=["Sesungguhnya Allah tidak membebani seseorang melainkan sesuai dengan kesanggupannya (QS. Al-Baqarah:286)","Dan dirikanlah shalat, tunaikan zakat dan ruku’lah beserta orang-orang yang ruku’ (QS. Al-Baqarah:43)","Allah mengetahui apa yang ada di langit dan di bumi, dan Allah Maha Mengetahui segala sesuatu (QS. Al-Hujurat:18)"];
function getMotivationalAyah(){return motivationalAyah[new Date().getDate()%motivationalAyah.length];}
function updateRadarAndAnalysis(day){
  updateRadar();
  const analysis=analyzeScore(day);
  const summary=getWeeklyMonthlySummary();
  alert(`🌟 Alhamdulillah, ${localStorage.getItem('taqwUser')}!\n${analysis.messages.join('\n')}\n\n✅ Rekomendasi Amalan Hari Ini:\n- ${analysis.recommendations.join('\n- ')}\n\n📊 Skor Mingguan: ${summary.weeklyAvg}\n📈 Skor Bulanan: ${summary.monthlyAvg}`);
}

// ====== PDF ======
document.getElementById('generatePDF').addEventListener('click',async()=>{
  const { jsPDF }=window.jspdf;
  const doc=new jsPDF();
  const name=localStorage.getItem('taqwUser')||'User';
  const today=new Date().getDate();
  doc.text(`Assalamu'alaikum ${name}`,10,10);
  doc.text('Alhamdulillah ini hasil skor ibadah harian:',10,20);
  const dayData=JSON.parse(localStorage.getItem(`day-${today}`))||{};
  let y=30;
  questions.forEach(q=>{doc.text(`${q}: ${dayData[q]||'-'}`,10,y); y+=10;});
  const analysis=analyzeScore(today);
  const summary=getWeeklyMonthlySummary();
  doc.text(`\nHasil Analisis:`,10,y); y+=10; analysis.messages.forEach(msg=>{doc.text(`- ${msg}`,10,y); y+=10;});
  doc.text(`\nRekomendasi Amalan:`,10,y); y+=10; analysis.recommendations.forEach(rec=>{doc.text(`- ${rec}`,10,y); y+=10;});
  doc.text(`\nSkor Mingguan: ${summary.weeklyAvg}`,10,y); y+=10;
  doc.text(`Skor Bulanan: ${summary.monthlyAvg}`,10,y); y+=10;
  doc.text(`\nAyat Motivasi: ${getMotivationalAyah()}`,10,y); y+=20;
  const canvas=document.getElementById('radarChart'); const imgData=canvas.toDataURL('image/png'); doc.addImage(imgData,'PNG',10,y,180,100);
  doc.save('taqwamenter-raport.pdf');
});

// ====== Share ======
function shareWA(){window.open('https://wa.me/?text=Check+my+progress');}
function shareEmail(){window.location.href='mailto:?subject=Taqwameter Progress';}
function shareIG(){window.open('https://instagram.com');}
function shareTT(){window.open('https://tiktok.com');}
</script>

</body>
</html>
